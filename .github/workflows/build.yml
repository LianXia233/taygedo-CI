name: build-release-openwrt

# OpenWrt 发布流水线（自原 build-release 按平台解耦而来）。
#
# 本工作流只负责 OpenWrt 形态：LuCI 集成二进制（--features openwrt）交叉编译、
# ipk/apk 打包与发布。Windows 桌面 / 静态 Linux WebUI / Debian 已移入
# build-other-systems.yml，Docker 镜像仍在 docker.yml —— 三条流水线互不阻塞：
# 任一平台编译失败不影响其余平台的产物发布。
#
# 触发策略：仅 push tag v* → 资产发布到同名正式版 Release。
# nightly 滚动预发布与 workflow_dispatch 手动构建已取消（不产预览版、
# 不做无事件自动编译）；需要重新出包时打一个新 tag 即可。
#
# 与 build-other-systems.yml 的 release 作业共享 release-assets 并发组：
# 同一 tag 下谁先完成谁创建 Release，另一方排队后追加自己的资产。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 0) 质量门禁（定义在 .github/workflows/quality.yml）
  #
  # 抽成可复用工作流，是因为同一份检查要在两个时机跑：
  #   - PR 打开/更新时（pull_request）：评审看代码前就拿到结论；
  #   - 发布之前（下面的 release 通过 needs 依赖本作业）：挡住 Release。
  # 复制两份脚本必然漂移，所以这里只做调用。
  # ---------------------------------------------------------------------------
  quality:
    uses: ./.github/workflows/quality.yml

  # ---------------------------------------------------------------------------
  # 0b) 依赖安全审计（RustSec advisory）
  #
  # 非阻塞：advisory 数据库每天都在变，一条与本次改动无关的新 advisory
  # 不应把整条发布流水线卡死。失败的结论会明确显示在 Actions 里，
  # 由维护者评估后单独升级依赖。全仓只跑这一份（在两条发布流水线中
  # 仅保留此处），audit 结论对所有平台产物同样生效。
  # ---------------------------------------------------------------------------
  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    # 审计作业本身不写仓库，但 rustsec/audit-check 需要创建 check run 来承载结论；
    # 缺 checks: write 时它会在日志里报 "Resource not accessible by integration - checks/runs"
    # 并以失败退出（曾被误读成漏洞问题，实际审计结论是 0 漏洞）。这里给作业级最小权限，
    # 同时不继承工作流顶层的 contents: write —— 作业级 permissions 是整体覆盖，不是追加。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main@2026-03-20 (node24, 上游未发版)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 1) 编译 OpenWrt 二进制（其余平台见 build-other-systems.yml）
  #
  # 形态在编译期确定（Cargo feature）：OpenWrt 产物以 `openwrt` feature 编译，
  # 只含业务 API，入口是 LuCI，不含任何前端资产。
  # LuCI 包（openwrt/luci-app-taygedo 的 Makefile）下载的是
  # `*-openwrt.tar.gz`，而不是通配的 Linux 产物——否则装到路由器上的
  # 仍是一个带 WebUI 的通用二进制。
  # ---------------------------------------------------------------------------
  build:
    name: build-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openwrt-x86_64-musl
            target: x86_64-unknown-linux-musl
            cargo_features: "--no-default-features --features openwrt"
            suffix: "-openwrt"
          - name: openwrt-aarch64-musl
            target: aarch64-unknown-linux-musl
            cargo_features: "--no-default-features --features openwrt"
            suffix: "-openwrt"
    steps:
      - uses: actions/checkout@v7

      # 仅清空镜像 include 文件（而非删除整个 config.toml）：GitHub runners
      # 直连 crates.io，无需 rsproxy；但 config.toml 里的 aarch64 aes_armv8
      # rustflags 必须保留，否则 OpenWrt 二进制会静默退化为软件 AES
      # （性能差约一个数量级 + cache-timing 侧信道）。所有 runner 一视同仁。
      - name: Use default crates.io on GitHub runners
        shell: bash
        run: printf '' > .cargo/config.mirror.toml

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        run: cross build --release --locked --target ${{ matrix.target }} ${{ matrix.cargo_features }}

      - name: Package (tar.gz)
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/taygedo-rs" dist/taygedo-rs
          NAME="taygedo-rs-${{ matrix.target }}${{ matrix.suffix }}.tar.gz"
          tar czf "$NAME" -C dist taygedo-rs
          cp "$NAME" dist/
          echo "packaged: $NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/

  # ---------------------------------------------------------------------------
  # 2) OpenWrt .ipk + .apk
  # ---------------------------------------------------------------------------
  openwrt:
    name: openwrt-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact: openwrt-x86_64-musl
          - arch: aarch64_cortex-a53
            artifact: openwrt-aarch64-musl
    steps:
      - uses: actions/checkout@v7
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: bin
      - name: Install apk-tools 3.x (for v3 ADB packaging)
        run: |
          # OpenWrt 24.10+ 的 apk 包是 v3 ADB 格式，必须用 apk-tools 3.0 的 mkpkg 生成。
          # 下载 Alpine 的 apk-tools-static（静态 x86_64 二进制，可交叉打包任意架构）。
          #
          # 版本策略：Alpine 在 minor 升级时会**删除旧版文件**，任何硬编码的 -rN 都
          # 会在上游发版后变成 404 并使整个作业中止（曾因此导致 openwrt-* 全量失败）。
          # 因此这里不写死版本：先按 APK_TOOLS_VER 尝试（便于锁定复现），失败则
          # 从目录索引自动解析当前最新版本，兼顾可复现性与抗上游漂移。
          BASE="https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64"
          APK_TOOLS_VER="${APK_TOOLS_VER:-}"

          fetch() {
            echo "尝试下载 apk-tools-static $1"
            curl -fsSL -o apk-tools-static.apk "$BASE/apk-tools-static-$1.apk"
          }

          ok=0
          if [ -n "$APK_TOOLS_VER" ] && fetch "$APK_TOOLS_VER"; then
            ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            RESOLVED="$(curl -fsSL "$BASE/" \
              | grep -o 'apk-tools-static-[0-9][0-9.]*-r[0-9]*\.apk' \
              | sed -E 's/^apk-tools-static-(.*)\.apk$/\1/' \
              | sort -V | tail -1)"
            if [ -z "$RESOLVED" ]; then
              echo "错误: 无法从 $BASE 解析 apk-tools-static 版本" >&2
              exit 1
            fi
            echo "自动解析到最新版本: $RESOLVED"
            fetch "$RESOLVED"
          fi

          mkdir -p apkstatic
          tar xzf apk-tools-static.apk -C apkstatic
          install -m755 apkstatic/sbin/apk.static /usr/local/bin/apk
          apk --version
      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "release=1" >> "$GITHUB_OUTPUT"
          echo "resolved version=$VER release=1 (ref=${GITHUB_REF_NAME})"
      - name: Package ipk + apk
        run: |
          BIN="$(find bin -type f -name 'taygedo-rs' | head -1)"
          chmod +x "$BIN"
          mkdir -p dist-openwrt
          bash scripts/package.sh ipk "${{ matrix.arch }}" "$BIN" \
            "${{ steps.ver.outputs.version }}" dist-openwrt "${{ steps.ver.outputs.release }}"
          bash scripts/package.sh apk "${{ matrix.arch }}" "$BIN" \
            "${{ steps.ver.outputs.version }}" dist-openwrt "${{ steps.ver.outputs.release }}"
      - uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ matrix.arch }}
          path: dist-openwrt/

  # ---------------------------------------------------------------------------
  # 3) 发布 OpenWrt 产物到 Releases
  #
  # 与 build-other-systems.yml 的 release 作业共享 release-assets 并发组：
  # 同一 tag / nightly 下串行发布，谁先到谁创建 Release，另一方追加资产。
  # ---------------------------------------------------------------------------
  release:
    name: release-openwrt
    needs: [quality, build, openwrt]
    runs-on: ubuntu-latest
    concurrency:
      group: release-assets-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.ipk' -o -name '*.apk' \) \
            -exec cp {} dist/ \;

      # 发布目标解析：工作流只由 tag v* 触发，直接取 tag 名作为 Release 目标。
      - name: Resolve release target
        id: rel
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=Taygedo $TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          {
            echo "## 构建信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${{ steps.rel.outputs.version }}\` |"
            echo "| 提交 | \`${{ steps.rel.outputs.sha }}\` |"
            echo "| 构建号 | \`${{ github.run_number }}\` |"
            echo "| OpenWrt 流水线 | [Run \`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "## OpenWrt 产物清单"
            echo ""
            echo "| 文件 | 大小 |"
            echo "| --- | ---: |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "> 本作业只发布 OpenWrt 产物（ipk / apk / *-openwrt.tar.gz）；"
            echo "> Windows 桌面 / Linux / Debian 资产由 build-release-other-systems 流水线发布到同一 Release。"
          } > notes.md
          cat notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          body_path: notes.md
          prerelease: false
          files: dist/*
          generate_release_notes: false
