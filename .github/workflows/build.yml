name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 0) 质量门禁（定义在 .github/workflows/quality.yml）
  #
  # 抽成可复用工作流，是因为同一份检查要在两个时机跑：
  #   - PR 打开/更新时（pull_request）：评审看代码前就拿到结论；
  #   - 发布之前（下面的 release 通过 needs 依赖本作业）：挡住 Release。
  # 复制两份脚本必然漂移，所以这里只做调用。
  # ---------------------------------------------------------------------------
  quality:
    uses: ./.github/workflows/quality.yml

  # ---------------------------------------------------------------------------
  # 0b) 依赖安全审计（RustSec advisory）
  #
  # 非阻塞：advisory 数据库每天都在变，一条与本次改动无关的新 advisory
  # 不应把整条发布流水线卡死。失败的结论会明确显示在 Actions 里，
  # 由维护者评估后单独升级依赖。
  # ---------------------------------------------------------------------------
  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    # 审计作业本身不写仓库，但 rustsec/audit-check 需要创建 check run 来承载结论；
    # 缺 checks: write 时它会在日志里报 "Resource not accessible by integration - checks/runs"
    # 并以失败退出（曾被误读成漏洞问题，实际审计结论是 0 漏洞）。这里给作业级最小权限，
    # 同时不继承工作流顶层的 contents: write —— 作业级 permissions 是整体覆盖，不是追加。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 1) 编译各平台二进制
  #
  # 形态在编译期确定（Cargo feature），因此同一 target 要出不同产物：
  #   - 默认（webui）：Debian / Docker / 静态 Linux 部署，自带 WebUI
  #   - openwrt：只含业务 API，入口是 LuCI，不含任何前端资产
  #   - desktop：Windows 桌面**单包**，无 WebUI 资产，只提供本机回环 API；
  #     服务端以库的形式编进 desktop/ crate，与 GPUI 界面同进程，
  #     发布物只有一个 exe（双进程会让服务子进程常驻并锁住 exe 映像）
  # OpenWrt 包必须用后者：它下载的是 `*-openwrt.tar.gz`，而不是通配的
  # Linux 产物——否则装到路由器上的仍是一个带 WebUI 的通用二进制。
  # ---------------------------------------------------------------------------
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows（desktop 单包：GPUI 界面 + 同进程内嵌回环服务，不含 WebUI）
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_features: "--no-default-features --features desktop"
            suffix: ""
            cross: false
          # Linux musl（独立部署：静态二进制，带 WebUI）
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cargo_features: ""
            suffix: ""
            cross: true
          - name: linux-aarch64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cargo_features: ""
            suffix: ""
            cross: true
          # OpenWrt（LuCI 集成：无 WebUI、无前端资产）
          - name: openwrt-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cargo_features: "--no-default-features --features openwrt"
            suffix: "-openwrt"
            cross: true
          - name: openwrt-aarch64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cargo_features: "--no-default-features --features openwrt"
            suffix: "-openwrt"
            cross: true
    steps:
      - uses: actions/checkout@v7

      # 仅清空镜像 include 文件（而非删除整个 config.toml）：GitHub runners
      # 直连 crates.io，无需 rsproxy；但 config.toml 里的 aarch64 aes_armv8
      # rustflags 必须保留，否则 OpenWrt 二进制会静默退化为软件 AES
      # （性能差约一个数量级 + cache-timing 侧信道）。所有 runner 一视同仁。
      - name: Use default crates.io on GitHub runners
        shell: bash
        run: printf '' > .cargo/config.mirror.toml

      - name: Install Rust (native)
        if: matrix.cross == false
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo (native)
        if: matrix.cross == false
        uses: Swatinem/rust-cache@v2
        with:
          # desktop/ 是独立 workspace（自己的 Cargo.lock 与 target/），
          # 不显式列出就缓存不到，Windows 单包每次都会全量重编 GPUI 依赖。
          workspaces: ". desktop"

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Windows 走单包：服务端不再单独产出 exe，而是作为库被 desktop/ crate
      # 静态链接进来，因此这里跳过主服务的独立构建。
      - name: Build (native)
        if: matrix.cross == false && matrix.os != 'windows-latest'
        run: cargo build --release --locked ${{ matrix.cargo_features }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }} ${{ matrix.cargo_features }}

      # Windows 桌面单包：GPUI 界面 + 内嵌服务同进程编译。
      # 独立 crate / 独立 Cargo.lock，GPUI 依赖不会进入 Linux / OpenWrt 构建图。
      #
      # 桌面 crate 的 fmt / clippy 只能在这里跑：它需要 GPUI 的平台依赖
      # （X11 / Wayland 或 MSVC + DirectX），Linux 的 quality 作业装不起。
      - name: Lint desktop single package
        if: matrix.os == 'windows-latest'
        run: |
          cargo fmt --check --manifest-path desktop/Cargo.toml
          cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Build desktop single package
        if: matrix.os == 'windows-latest'
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            # 单包：GPUI 界面与内嵌服务是同一个 exe
            echo "path=desktop/target/release/taygedo.exe" >> "$GITHUB_OUTPUT"
            echo "name=taygedo.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/${{ matrix.target }}/release/taygedo-rs" >> "$GITHUB_OUTPUT"
            echo "name=taygedo-rs" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Windows zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 单包：压缩包里只有一个可执行文件。
          # 不再附带独立的服务 exe —— 那会引入"客户端退出、服务常驻"的孤儿进程，
          # 进而锁住 exe 映像，用户无法删除安装目录。
          Copy-Item "desktop/target/release/taygedo.exe" dist/taygedo.exe
          Compress-Archive -Path dist/taygedo.exe -DestinationPath dist/taygedo-rs-windows-x86_64.zip -Force

      - name: Package (Linux tar.gz)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ steps.bin.outputs.path }}" dist/taygedo-rs
          NAME="taygedo-rs-${{ matrix.target }}${{ matrix.suffix }}.tar.gz"
          tar czf "$NAME" -C dist taygedo-rs
          cp "$NAME" dist/
          echo "packaged: $NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/

  # ---------------------------------------------------------------------------
  # 2) Debian .deb
  # ---------------------------------------------------------------------------
  debian:
    name: debian-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use default crates.io on GitHub runners
        shell: bash
        run: printf '' > .cargo/config.mirror.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build (glibc)
        run: cargo build --release --locked
      # 版本号解析：${GITHUB_REF_NAME#v} 仅在 tag 推送时才是版本号；
      # workflow_dispatch / 分支推送时得到的是分支名（如 main），
      # 而 dpkg-deb 与 apk mkpkg 都要求版本号以数字开头，否则直接失败。
      # 非 tag 构建回退为 Cargo.toml 版本，保证恒可打包。
      # release 号恒为 1：nightly 是滚动发布，资产名必须稳定才能被覆盖更新，
      # 构建号改由 Release 标题承载（见 release 作业的 Release target 步骤）。
      - name: Resolve version
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          if printf '%s' "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VER="$RAW"
          else
            VER="$(grep -m1 -E '^[[:space:]]*version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            VER="${VER#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "release=1" >> "$GITHUB_OUTPUT"
          echo "resolved version=$VER release=1 (ref=${GITHUB_REF_NAME})"
      - name: Package .deb
        run: |
          bash scripts/package.sh deb x86_64 target/release/taygedo-rs \
            "${{ steps.ver.outputs.version }}" dist-deb "${{ steps.ver.outputs.release }}"
      - uses: actions/upload-artifact@v7
        with:
          name: debian-amd64
          path: dist-deb/*.deb

  # ---------------------------------------------------------------------------
  # 3) OpenWrt .ipk + .apk
  # ---------------------------------------------------------------------------
  openwrt:
    name: openwrt-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact: openwrt-x86_64-musl
          - arch: aarch64_cortex-a53
            artifact: openwrt-aarch64-musl
    steps:
      - uses: actions/checkout@v7
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: bin
      - name: Install apk-tools 3.x (for v3 ADB packaging)
        run: |
          # OpenWrt 24.10+ 的 apk 包是 v3 ADB 格式，必须用 apk-tools 3.0 的 mkpkg 生成。
          # 下载 Alpine 的 apk-tools-static（静态 x86_64 二进制，可交叉打包任意架构）。
          #
          # 版本策略：Alpine 在 minor 升级时会**删除旧版文件**，任何硬编码的 -rN 都
          # 会在上游发版后变成 404 并使整个作业中止（曾因此导致 openwrt-* 全量失败）。
          # 因此这里不写死版本：先按 APK_TOOLS_VER 尝试（便于锁定复现），失败则
          # 从目录索引自动解析当前最新版本，兼顾可复现性与抗上游漂移。
          BASE="https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64"
          APK_TOOLS_VER="${APK_TOOLS_VER:-}"

          fetch() {
            echo "尝试下载 apk-tools-static $1"
            curl -fsSL -o apk-tools-static.apk "$BASE/apk-tools-static-$1.apk"
          }

          ok=0
          if [ -n "$APK_TOOLS_VER" ] && fetch "$APK_TOOLS_VER"; then
            ok=1
          fi
          if [ "$ok" -eq 0 ]; then
            RESOLVED="$(curl -fsSL "$BASE/" \
              | grep -o 'apk-tools-static-[0-9][0-9.]*-r[0-9]*\.apk' \
              | sed -E 's/^apk-tools-static-(.*)\.apk$/\1/' \
              | sort -V | tail -1)"
            if [ -z "$RESOLVED" ]; then
              echo "错误: 无法从 $BASE 解析 apk-tools-static 版本" >&2
              exit 1
            fi
            echo "自动解析到最新版本: $RESOLVED"
            fetch "$RESOLVED"
          fi

          mkdir -p apkstatic
          tar xzf apk-tools-static.apk -C apkstatic
          install -m755 apkstatic/sbin/apk.static /usr/local/bin/apk
          apk --version
      - name: Resolve version
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          if printf '%s' "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VER="$RAW"
          else
            VER="$(grep -m1 -E '^[[:space:]]*version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            VER="${VER#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "release=1" >> "$GITHUB_OUTPUT"
          echo "resolved version=$VER release=1 (ref=${GITHUB_REF_NAME})"
      - name: Package ipk + apk
        run: |
          BIN="$(find bin -type f -name 'taygedo-rs' | head -1)"
          chmod +x "$BIN"
          mkdir -p dist-openwrt
          bash scripts/package.sh ipk "${{ matrix.arch }}" "$BIN" \
            "${{ steps.ver.outputs.version }}" dist-openwrt "${{ steps.ver.outputs.release }}"
          bash scripts/package.sh apk "${{ matrix.arch }}" "$BIN" \
            "${{ steps.ver.outputs.version }}" dist-openwrt "${{ steps.ver.outputs.release }}"
      - uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ matrix.arch }}
          path: dist-openwrt/

  # ---------------------------------------------------------------------------
  # 4) 发布到 Releases
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [quality, build, debian, openwrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.ipk' -o -name '*.apk' \) \
            -exec cp {} dist/ \;

      # 发布目标解析（两种触发方式走两条路径）：
      #   push tag vX.Y.Z  -> 正式版：tag=vX.Y.Z，标题 "Taygedo vX.Y.Z"，非预发布
      #   workflow_dispatch-> 滚动 nightly：固定 tag=nightly，标题带构建号，标记预发布。
      # 之所以不按分支名当 tag：手动触发时 github.ref 是 refs/heads/main，
      # 直接交给 action 会创建名为 main 的 Release，属于脏数据。
      - name: Resolve release target
        id: rel
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*)
              TAG="${GITHUB_REF#refs/tags/}"
              VER="${TAG#v}"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "name=Taygedo $TAG" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              VER="$(grep -m1 -E '^[[:space:]]*version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
              VER="${VER#v}"
              echo "tag=nightly" >> "$GITHUB_OUTPUT"
              echo "name=Taygedo Nightly v${VER} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # nightly 是滚动 tag：资产名固定时会被同名覆盖，但版本号变动会留下历史文件，
      # 因此发布前先清空该 Release 的全部旧资产，保证始终只有一份最新产物。
      - name: Clean previous nightly assets
        if: steps.rel.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[].name' > old_assets.txt 2>/dev/null || :
          if [ -s old_assets.txt ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "removing old asset: $f"
              gh release delete-asset nightly "$f" --repo "${GITHUB_REPOSITORY}" --yes || true
            done < old_assets.txt
          else
            echo "nightly release 尚不存在或无历史资产，跳过清理"
          fi

      - name: Build release notes
        run: |
          {
            echo "## 构建信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${{ steps.rel.outputs.version }}\` |"
            echo "| 提交 | \`${{ steps.rel.outputs.sha }}\` |"
            echo "| 构建号 | \`${{ github.run_number }}\` |"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 流水线 | [Run \`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "## 产物清单"
            echo ""
            echo "| 文件 | 大小 |"
            echo "| --- | ---: |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            if [ "${{ steps.rel.outputs.prerelease }}" = "true" ]; then
              echo "> 本 Release 为 nightly 滚动预发布，每次手动构建覆盖更新，仅保留最新产物。"
              echo "> 生产环境请使用正式版 tag（形如 \`vX.Y.Z\`）对应的 Release。"
            fi
          } > notes.md
          cat notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          body_path: notes.md
          prerelease: ${{ steps.rel.outputs.prerelease }}
          files: dist/*
          generate_release_notes: false
