name: quality

# 质量门禁。同一份定义服务两个时机：
#
#   1) `pull_request`：PR 打开 / 更新时立刻给出 fmt / clippy / test / E2E 结论，
#      评审在看代码之前就拿到结果；
#   2) `workflow_call`：被 build-release.yml 以 `uses:` 调用，`release` 通过
#      `needs` 依赖它 —— 加密存储与传输协议的回归一旦漏到 Release，用户那边
#      的表现是"密钥损坏 / 登录进不去"，属于不可接受故障，必须在打包前拦住。
#
# 抽成独立工作流而不是在 build.yml 里再写一份：两份脚本必然漂移，
# 而漂移的方向通常是"PR 上跑的那份悄悄放宽了"。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# 只读即可：本作业不写仓库、不发 Release。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub runner 直连 crates.io；仓库里的 .cargo/config.mirror.toml 是给
      # 受限网络环境准备的 include，这里清空避免指向不可达镜像。
      - name: Use default crates.io on GitHub runners
        shell: bash
        run: printf '' > .cargo/config.mirror.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets --locked

      # 端到端协议测试：用**真实二进制** + **仓库里真实的前端客户端文件**
      # 走完整链路（清单验签 → 握手验签 → 业务 → 重放/搬移/降级拒绝）。
      # 服务端已无内置 WebUI 与自有登录，测试不携带 Authorization，
      # 靠本机回环来源通过访问控制。
      - name: Build binary for E2E
        run: cargo build --locked

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: End-to-end protocol test
        run: |
          set -euo pipefail
          DATA_DIR="$(mktemp -d)"
          # always：强制所有来源加密，才能验证"明文降级被拒"这条分支
          TAYGEDO_DATA_DIR="$DATA_DIR" \
          TAYGEDO_CRYPTO_POLICY=always \
          ./target/debug/taygedo-rs > server.log 2>&1 &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/meta >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8787/api/meta >/dev/null
          node scripts/e2e_web.mjs http://127.0.0.1:8787
          kill $SRV_PID 2>/dev/null || true
          wait $SRV_PID 2>/dev/null || true
          trap - EXIT

      # 归档服务端日志，失败时方便定位（E2E 失败时二进制日志是第一现场）
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: server.log
          if-no-files-found: ignore
