[package]
name = "taygedo-rs"
version = "0.7.3"
edition = "2021"
description = "塔吉多自动签到 - Rust 重写版（webui / openwrt / desktop 三构建形态：平台抽象层隔离 OS 差异，Windows 桌面走原生 GPUI）"
license = "GPL-3.0-only"

[lib]
# 库目标不是给外部用户当 SDK 用的，只为两件事：
#   1) 桌面单包在同一进程内启动 axum 服务（避免双进程锁住 exe 映像）；
#   2) 独立服务 bin 与单包共用同一份启动逻辑，不出现两套实现漂移。
name = "taygedo"
path = "src/lib.rs"

[[bin]]
name = "taygedo-rs"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# 构建形态（互斥，必须三选一）
# ---------------------------------------------------------------------------
# 三种部署形态在**编译期**彻底分离，不靠运行期探测决定行为：
#
#   webui   —— Linux / Docker / 独立服务器
#              内置 WebUI（首页 + 自有登录 + 改密 + 应用层加密信封）
#   openwrt —— OpenWrt 集成
#              只有业务 API，入口是 LuCI；鉴权交给 LuCI/ubus 会话
#   desktop —— Windows 桌面（GPUI 客户端）
#              无首页、无静态资源、无浏览器侧加密资产、无登录/改密；
#              只暴露本机回环 REST API，鉴权边界是「回环来源」。
#              UI 由独立 crate `desktop/`（原生 Rust GPUI）承担。
#
# desktop 产物里不存在任何 WebUI 字节：路由、静态资源与加密中间件
# 根本没有被编译进去，不是"注册了路由再返回 404/410"。
#
# 构建：
#   cargo build --release --locked                                  # webui
#   cargo build --release --locked --no-default-features \
#                --features openwrt                                # openwrt
#   cargo build --release --locked --no-default-features \
#                --features desktop                                # desktop
[features]
default = ["webui"]
webui = []
openwrt = []
desktop = []

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
aes = "0.8"
aes-gcm = "0.10"
# XChaCha20-Poly1305：配置静态加密与（v2）应用层传输加密的唯一 AEAD。
# RustCrypto 实现，纯 Rust、无 unsafe 密码学代码、MIT/Apache-2.0 双许可。
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "std"] }
# Ed25519：服务端长期身份签名（握手 Transcript 签名 + 静态资源清单签名）。
# dalek 系实现，BSD-3-Clause，纯 Rust。
ed25519-dalek = { version = "2", features = ["rand_core"] }
scrypt = "0.11"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
ipnet = "2"
# 数据目录级排他锁：防止并发启动同时迁移/写入导致文件损坏。
# 跨平台（Linux flock / Windows LockFileEx），MIT/Apache-2.0。
fs4 = { version = "0.12", features = ["sync"] }

# Unix 专属：O_NOFOLLOW / fstat 等基于文件描述符的安全文件操作所需常量。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 专属：DPAPI（CryptProtectData / CryptUnprotectData）保护应用主密钥。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
