[package]
name = "taygedo-rs"
version = "0.2.6"
edition = "2021"
description = "塔吉多自动签到 - Rust 重写版，带 WebUI 管理界面"
license = "MIT"

[[bin]]
name = "taygedo-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
aes = "0.8"
aes-gcm = "0.10"
scrypt = "0.11"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[profile.release]
strip = true
lto = true
