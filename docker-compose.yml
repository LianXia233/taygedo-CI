services:
  taygedo:
    build: .
    image: taygedo-rs:latest
    container_name: taygedo-rs
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TAYGEDO_LISTEN: 0.0.0.0:8787
      TAYGEDO_DATA_DIR: /data
      # 本镜像以 webui 形态构建（Dockerfile 显式 --features webui）：
      # 内置 WebUI 随服务一起启动，浏览器访问 http://<宿主机IP>:8787 即可。
      # 首次启动的随机口令用 `docker compose logs taygedo` 查看（只打印一次），
      # 或用 TAYGEDO_WEB_PASSWORD 直接指定初始口令。
      # 访问控制：只接受回环或 lan_cidrs 白名单来源——容器内 127.0.0.1 不是
      # 宿主机，外部访问需要放通内网网段，例如收窄到实际调用方：
      #   TAYGEDO_LAN_CIDRS: "192.168.1.0/24"
    volumes:
      - ./data:/data
