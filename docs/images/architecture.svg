<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
<style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Hiragino Sans GB',sans-serif}
@media (prefers-color-scheme: dark){
g.s-blue>rect,g.s-blue>circle,g.s-blue>polygon{fill:#042C53;stroke:#85B7EB}
g.s-blue>text{fill:#B5D4F4}
g.s-teal>rect,g.s-teal>circle,g.s-teal>polygon{fill:#04342C;stroke:#5DCAA5}
g.s-teal>text{fill:#9FE1CB}
g.s-amber>rect,g.s-amber>circle,g.s-amber>polygon{fill:#412402;stroke:#EF9F27}
g.s-amber>text{fill:#FAC775}
g.s-purple>rect,g.s-purple>circle,g.s-purple>polygon{fill:#26215C;stroke:#AFA9EC}
g.s-purple>text{fill:#CECBF6}
g.s-coral>rect,g.s-coral>circle,g.s-coral>polygon{fill:#4A1B0C;stroke:#F0997B}
g.s-coral>text{fill:#F5C4B3}
g.s-gray>rect,g.s-gray>circle,g.s-gray>polygon{fill:#2C2C2A;stroke:#B4B2A9}
g.s-gray>text{fill:#D3D1C7}
g.s-red>rect,g.s-red>circle,g.s-red>polygon{fill:#501313;stroke:#F09595}
g.s-red>text{fill:#F7C1C1}
g.s-green>rect,g.s-green>circle,g.s-green>polygon{fill:#173404;stroke:#97C459}
g.s-green>text{fill:#C0DD97}
g.s-pink>rect,g.s-pink>circle,g.s-pink>polygon{fill:#4B1528;stroke:#ED93B1}
g.s-pink>text{fill:#F4C0D1}
g.s-neutral>rect{fill:#2C2C2A;stroke:#B4B2A9}
g.s-neutral>text{fill:#D3D1C7}
g.s-t1>text{fill:#F1EFE8}
g.s-t2>text{fill:#B4B2A9}
g.s-t3>text{fill:#888780}
g.s-ln>line,g.s-ln>path{stroke:#B4B2A9}
g.s-div>line{stroke:#444441}
}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g class="s-t1"><text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">系统架构：三层解耦与本机数据</text></g>
<g class="s-t3"><text x="40" y="52" font-size="12" fill="#888780">界面层与执行层通过 REST API 通信；数据层位于进程本地磁盘。</text></g>
<g class="s-blue">
<rect x="40" y="74" width="178" height="74" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="129" y="84" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">界面层</text>
<text x="129" y="104" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WebUI（单文件）</text>
<text x="129" y="120" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">LuCI 页面</text>
<text x="129" y="138" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">手机浏览器</text>
</g>
<g class="s-teal">
<rect x="251" y="74" width="178" height="74" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="92" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">执行层：taygedo-rs</text>
<text x="340" y="112" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">axum HTTP 服务</text>
<text x="340" y="129" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">调度器 + 签到引擎</text>
</g>
<g class="s-amber">
<rect x="462" y="74" width="178" height="74" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="551" y="92" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">外部平台</text>
<text x="551" y="112" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">塔吉多 / 老虎 API</text>
<text x="551" y="129" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">签到与登录态续期</text>
</g>
<g class="s-purple">
<rect x="40" y="176" width="178" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="129" y="186" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">数据层</text>
<text x="129" y="206" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">accounts.json</text>
<text x="129" y="222" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">config.json / state.json</text>
<text x="129" y="240" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">keyring.json</text>
</g>
<g class="s-gray">
<rect x="251" y="176" width="178" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="194" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">加密通道</text>
<text x="340" y="214" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">X25519 握手</text>
<text x="340" y="231" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">AES-256-GCM 正文</text>
</g>
<g class="s-coral">
<rect x="462" y="176" width="178" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="551" y="186" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">OpenWrt 集成</text>
<text x="551" y="206" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">procd 守护</text>
<text x="551" y="222" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">rpcd / ACL</text>
<text x="551" y="240" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">UCI 配置</text>
</g>
<g class="s-ln"><line x1="220" y1="111" x2="249" y2="111" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-ln"><line x1="431" y1="111" x2="460" y2="111" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-t2"><text x="228" y="100" font-size="11" fill="#5F5E5A">REST</text></g>
<g class="s-t2"><text x="437" y="100" font-size="11" fill="#5F5E5A">HTTPS</text></g>
<g class="s-ln"><line x1="118" y1="152" x2="118" y2="174" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-t2"><text x="124" y="168" font-size="11" fill="#5F5E5A">读写</text></g>
<g class="s-ln"><line x1="340" y1="152" x2="340" y2="174" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-t2"><text x="346" y="168" font-size="11" fill="#5F5E5A">承载体</text></g>
<g class="s-ln"><line x1="551" y1="152" x2="551" y2="174" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-t2"><text x="557" y="168" font-size="11" fill="#5F5E5A">托管</text></g>
<g class="s-ln"><line x1="462" y1="213" x2="431" y2="213" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)"/></g>
<g class="s-t2"><text x="437" y="205" font-size="11" fill="#5F5E5A">同一 API</text></g>
<g class="s-div"><line x1="40" y1="274" x2="640" y2="274" stroke="#D3D1C7" stroke-width="0.5"/></g>
<g class="s-t1"><text x="40" y="300" font-size="15" font-weight="500" fill="#2C2C2A">关键设计取舍</text></g>
<text class="s-t1" x="52" y="320" font-size="13" font-weight="500" fill="#2C2C2A">单文件二进制</text>
<g class="s-t2"><text x="190" y="320" font-size="13" fill="#5F5E5A">无运行时依赖，musl 静态链接</text></g>
<text class="s-t1" x="52" y="346" font-size="13" font-weight="500" fill="#2C2C2A">北京时间固定</text>
<g class="s-t2"><text x="190" y="346" font-size="13" fill="#5F5E5A">调度不随设备时区漂移</text></g>
<text class="s-t1" x="52" y="372" font-size="13" font-weight="500" fill="#2C2C2A">界面无状态</text>
<g class="s-t2"><text x="190" y="372" font-size="13" fill="#5F5E5A">LuCI 不维护 token，直连 REST</text></g>
</svg>
