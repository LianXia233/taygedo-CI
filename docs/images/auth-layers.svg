<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" width="100%" role="img">
<style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Hiragino Sans GB',sans-serif}
@media (prefers-color-scheme: dark){
g.s-blue>rect,g.s-blue>circle,g.s-blue>polygon{fill:#042C53;stroke:#85B7EB}
g.s-blue>text{fill:#B5D4F4}
g.s-teal>rect,g.s-teal>circle,g.s-teal>polygon{fill:#04342C;stroke:#5DCAA5}
g.s-teal>text{fill:#9FE1CB}
g.s-amber>rect,g.s-amber>circle,g.s-amber>polygon{fill:#412402;stroke:#EF9F27}
g.s-amber>text{fill:#FAC775}
g.s-purple>rect,g.s-purple>circle,g.s-purple>polygon{fill:#26215C;stroke:#AFA9EC}
g.s-purple>text{fill:#CECBF6}
g.s-coral>rect,g.s-coral>circle,g.s-coral>polygon{fill:#4A1B0C;stroke:#F0997B}
g.s-coral>text{fill:#F5C4B3}
g.s-gray>rect,g.s-gray>circle,g.s-gray>polygon{fill:#2C2C2A;stroke:#B4B2A9}
g.s-gray>text{fill:#D3D1C7}
g.s-red>rect,g.s-red>circle,g.s-red>polygon{fill:#501313;stroke:#F09595}
g.s-red>text{fill:#F7C1C1}
g.s-green>rect,g.s-green>circle,g.s-green>polygon{fill:#173404;stroke:#97C459}
g.s-green>text{fill:#C0DD97}
g.s-pink>rect,g.s-pink>circle,g.s-pink>polygon{fill:#4B1528;stroke:#ED93B1}
g.s-pink>text{fill:#F4C0D1}
g.s-neutral>rect{fill:#2C2C2A;stroke:#B4B2A9}
g.s-neutral>text{fill:#D3D1C7}
g.s-t1>text{fill:#F1EFE8}
g.s-t2>text{fill:#B4B2A9}
g.s-t3>text{fill:#888780}
g.s-ln>line,g.s-ln>path{stroke:#B4B2A9}
g.s-div>line{stroke:#444441}
}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g class="s-t1"><text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">请求处理链：鉴权与加密两道闸门</text></g>
<g class="s-t3"><text x="40" y="52" font-size="12" fill="#888780">加密中间件先解出正文，鉴权中间件再校验身份；两者均不受前端控制。</text></g>
<g class="s-gray">
<rect x="40" y="74" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="92" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">HTTP 请求</text>
<text x="100" y="112" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">明文头 + 密文正文</text>
</g>
<g class="s-ln"><line x1="162" y1="102" x2="192" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-purple">
<rect x="194" y="74" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="260" y="92" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">CORS 白名单</text>
<text x="260" y="112" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">同源校验</text>
</g>
<g class="s-ln"><line x1="328" y1="102" x2="358" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-blue">
<rect x="360" y="74" width="142" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="431" y="92" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">加密中间件</text>
<text x="431" y="112" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">握手 / 解密 / 验签</text>
</g>
<g class="s-ln"><line x1="504" y1="102" x2="534" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-teal">
<rect x="536" y="74" width="104" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="588" y="92" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">鉴权中间件</text>
<text x="588" y="112" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Token 校验</text>
</g>
<g class="s-ln"><line x1="588" y1="132" x2="588" y2="168" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-ln"><line x1="436" y1="132" x2="436" y2="168" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-green">
<rect x="360" y="170" width="280" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="500" y="188" font-size="14" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">路由处理函数</text>
<text x="500" y="208" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">业务编排</text>
</g>
<g class="s-amber">
<rect x="40" y="170" width="296" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="188" y="179" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">免鉴权放行条件</text>
<text x="188" y="199" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">OpenWrt 平台且开启了免鉴权</text>
<text x="188" y="216" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">立即放行，跳过 Token 校验</text>
</g>
<g class="s-div"><line x1="40" y1="250" x2="640" y2="250" stroke="#D3D1C7" stroke-width="0.5"/></g>
<g class="s-t1"><text x="40" y="276" font-size="15" font-weight="500" fill="#2C2C2A">两类闸门的分工</text></g>
<text class="s-t1" x="52" y="298" font-size="13" font-weight="500" fill="#2C2C2A">加密闸门</text>
<g class="s-t2"><text x="190" y="298" font-size="13" fill="#5F5E5A">能否读懂正文 —— 决定链路保密性</text></g>
<text class="s-t1" x="52" y="324" font-size="13" font-weight="500" fill="#2C2C2A">鉴权闸门</text>
<g class="s-t2"><text x="190" y="324" font-size="13" fill="#5F5E5A">能否执行操作 —— 决定操作合法性</text></g>
<g class="s-t3"><text x="40" y="356" font-size="12" fill="#888780">两者独立生效：仅加密不鉴权，仍无法越权；仅鉴权不加密，正文仍会被抓包读到。</text></g>
</svg>
