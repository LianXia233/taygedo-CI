<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 574" width="100%" role="img">
<style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Hiragino Sans GB',sans-serif}
@media (prefers-color-scheme: dark){
g.s-blue>rect,g.s-blue>circle,g.s-blue>polygon{fill:#042C53;stroke:#85B7EB}
g.s-blue>text{fill:#B5D4F4}
g.s-teal>rect,g.s-teal>circle,g.s-teal>polygon{fill:#04342C;stroke:#5DCAA5}
g.s-teal>text{fill:#9FE1CB}
g.s-amber>rect,g.s-amber>circle,g.s-amber>polygon{fill:#412402;stroke:#EF9F27}
g.s-amber>text{fill:#FAC775}
g.s-purple>rect,g.s-purple>circle,g.s-purple>polygon{fill:#26215C;stroke:#AFA9EC}
g.s-purple>text{fill:#CECBF6}
g.s-coral>rect,g.s-coral>circle,g.s-coral>polygon{fill:#4A1B0C;stroke:#F0997B}
g.s-coral>text{fill:#F5C4B3}
g.s-gray>rect,g.s-gray>circle,g.s-gray>polygon{fill:#2C2C2A;stroke:#B4B2A9}
g.s-gray>text{fill:#D3D1C7}
g.s-red>rect,g.s-red>circle,g.s-red>polygon{fill:#501313;stroke:#F09595}
g.s-red>text{fill:#F7C1C1}
g.s-green>rect,g.s-green>circle,g.s-green>polygon{fill:#173404;stroke:#97C459}
g.s-green>text{fill:#C0DD97}
g.s-pink>rect,g.s-pink>circle,g.s-pink>polygon{fill:#4B1528;stroke:#ED93B1}
g.s-pink>text{fill:#F4C0D1}
g.s-neutral>rect{fill:#2C2C2A;stroke:#B4B2A9}
g.s-neutral>text{fill:#D3D1C7}
g.s-t1>text{fill:#F1EFE8}
g.s-t2>text{fill:#B4B2A9}
g.s-t3>text{fill:#888780}
g.s-ln>line,g.s-ln>path{stroke:#B4B2A9}
g.s-div>line{stroke:#444441}
}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g class="s-t1"><text x="40" y="30" font-size="16" font-weight="500" fill="#2C2C2A">taygedo 应用层端到端加密原理</text></g>
<g class="s-t3"><text x="40" y="52" font-size="12" fill="#888780">加密位于浏览器前端与后端服务之间：两端各自持有明文，链路中间只有密文。</text></g>
<g class="s-blue">
<rect x="40" y="74" width="200" height="96" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="94" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">浏览器前端</text>
<text x="140" y="114" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WebUI / LuCI 页面</text>
<text x="140" y="132" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">持有会话密钥</text>
<text x="140" y="148" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">此框内为明文</text>
</g>
<g class="s-teal">
<rect x="440" y="74" width="200" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="94" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">后端服务</text>
<text x="540" y="114" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">taygedo-rs（axum）</text>
<text x="540" y="132" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">持有身份私钥与会话密钥</text>
<text x="540" y="148" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">此框内为明文</text>
</g>
<g class="s-red">
<rect x="276" y="96" width="128" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="112" font-size="14" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">HTTP 链路</text>
<text x="340" y="132" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">只有密文</text>
</g>
<g class="s-ln"><line x1="242" y1="122" x2="274" y2="122" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-ln"><line x1="406" y1="122" x2="438" y2="122" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<line class="s-ln" x1="260" y1="188" x2="420" y2="188" stroke="#B4B2A9" stroke-width="0.9" stroke-dasharray="4 3"/>
<g class="s-t2"><text x="340" y="206" font-size="12" fill="#5F5E5A">加密边界位于 HTTP 之内，不是 TLS</text></g>
<g class="s-div"><line x1="40" y1="226" x2="640" y2="226" stroke="#D3D1C7" stroke-width="0.5"/></g>
<g class="s-t1"><text x="40" y="252" font-size="15" font-weight="500" fill="#2C2C2A">握手阶段：协商密钥，每个会话执行一次</text></g>
<g class="s-gray">
<rect x="40" y="268" width="178" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="129" y="288" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">① 客户端发起</text>
<text x="129" y="308" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">临时公钥 + 随机数</text>
</g>
<g class="s-ln"><line x1="220" y1="299" x2="249" y2="299" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-blue">
<rect x="251" y="268" width="178" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="288" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② 服务端应答</text>
<text x="340" y="308" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">临时密钥对，用完即弃</text>
</g>
<g class="s-ln"><line x1="431" y1="299" x2="460" y2="299" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-amber">
<rect x="462" y="268" width="178" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="551" y="288" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">③ 双方各自推导</text>
<text x="551" y="308" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">X25519 得到同一共享秘密</text>
</g>
<g class="s-div"><line x1="40" y1="356" x2="640" y2="356" stroke="#D3D1C7" stroke-width="0.5"/></g>
<g class="s-t1"><text x="40" y="382" font-size="15" font-weight="500" fill="#2C2C2A">密钥派生：域分离，双向材料互不重叠</text></g>
<g class="s-gray">
<rect x="40" y="398" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="414" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">共享秘密</text>
<text x="115" y="434" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">X25519 ECDH</text>
</g>
<g class="s-ln"><line x1="192" y1="424" x2="220" y2="424" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-amber">
<rect x="222" y="398" width="150" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="297" y="414" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">主密钥</text>
<text x="297" y="434" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">HKDF aead</text>
</g>
<g class="s-ln"><line x1="374" y1="410" x2="402" y2="410" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-ln"><line x1="374" y1="438" x2="402" y2="438" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-teal">
<rect x="404" y="386" width="150" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="479" y="400" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">请求方向密钥</text>
<text x="479" y="420" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">HKDF c2s</text>
</g>
<g class="s-teal">
<rect x="404" y="444" width="150" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="479" y="458" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">响应方向密钥</text>
<text x="479" y="478" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">HKDF s2c</text>
</g>
<g class="s-green">
<rect x="566" y="386" width="74" height="106" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="603" y="412" font-size="14" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">每方向</text>
<text x="603" y="432" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">密钥不同</text>
<text x="603" y="448" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">前缀不同</text>
<text x="603" y="466" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">序号递增</text>
</g>
<g class="s-t3"><text x="40" y="528" font-size="12" fill="#888780">序号仅接受大于上次值，且验签通过后才推进，因此重放同一密文会被拒绝。</text></g>
<g class="s-t3"><text x="40" y="550" font-size="12" fill="#888780">会话密钥过期或超限即擦除；长期身份私钥不参与派生，历史抓包无法解密。</text></g>
</svg>
