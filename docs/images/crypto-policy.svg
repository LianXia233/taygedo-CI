<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" width="100%" role="img">
<style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Hiragino Sans GB',sans-serif}
@media (prefers-color-scheme: dark){
g.s-blue>rect,g.s-blue>circle,g.s-blue>polygon{fill:#042C53;stroke:#85B7EB}
g.s-blue>text{fill:#B5D4F4}
g.s-teal>rect,g.s-teal>circle,g.s-teal>polygon{fill:#04342C;stroke:#5DCAA5}
g.s-teal>text{fill:#9FE1CB}
g.s-amber>rect,g.s-amber>circle,g.s-amber>polygon{fill:#412402;stroke:#EF9F27}
g.s-amber>text{fill:#FAC775}
g.s-purple>rect,g.s-purple>circle,g.s-purple>polygon{fill:#26215C;stroke:#AFA9EC}
g.s-purple>text{fill:#CECBF6}
g.s-coral>rect,g.s-coral>circle,g.s-coral>polygon{fill:#4A1B0C;stroke:#F0997B}
g.s-coral>text{fill:#F5C4B3}
g.s-gray>rect,g.s-gray>circle,g.s-gray>polygon{fill:#2C2C2A;stroke:#B4B2A9}
g.s-gray>text{fill:#D3D1C7}
g.s-red>rect,g.s-red>circle,g.s-red>polygon{fill:#501313;stroke:#F09595}
g.s-red>text{fill:#F7C1C1}
g.s-green>rect,g.s-green>circle,g.s-green>polygon{fill:#173404;stroke:#97C459}
g.s-green>text{fill:#C0DD97}
g.s-pink>rect,g.s-pink>circle,g.s-pink>polygon{fill:#4B1528;stroke:#ED93B1}
g.s-pink>text{fill:#F4C0D1}
g.s-neutral>rect{fill:#2C2C2A;stroke:#B4B2A9}
g.s-neutral>text{fill:#D3D1C7}
g.s-t1>text{fill:#F1EFE8}
g.s-t2>text{fill:#B4B2A9}
g.s-t3>text{fill:#888780}
g.s-ln>line,g.s-ln>path{stroke:#B4B2A9}
g.s-div>line{stroke:#444441}
}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g class="s-t1"><text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">crypto_policy：加密策略判定</text></g>
<g class="s-t3"><text x="40" y="52" font-size="12" fill="#888780">在服务端中间件内完成，前端无法绕过或伪造来源地址。</text></g>
<g class="s-purple">
<rect x="40" y="74" width="152" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="116" y="96" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">读取策略</text>
<text x="116" y="112" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">crypto_policy</text>
</g>
<g class="s-ln"><line x1="194" y1="105" x2="226" y2="105" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-blue">
<rect x="228" y="74" width="152" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="304" y="89" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">取真实对端 IP</text>
<text x="304" y="104" font-size="11.0" fill="#185FA5" text-anchor="middle" dominant-baseline="central">ConnectInfo</text>
<text x="304" y="120" font-size="11.0" fill="#185FA5" text-anchor="middle" dominant-baseline="central">忽略 X-Forwarded-For</text>
</g>
<g class="s-ln"><line x1="382" y1="105" x2="414" y2="105" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-amber">
<rect x="416" y="74" width="152" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="492" y="88" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">匹配 lan_cidrs</text>
<text x="492" y="103" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">含 IPv4-mapped</text>
<text x="492" y="120" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">归一化处理</text>
</g>
<g class="s-ln"><line x1="570" y1="105" x2="602" y2="105" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-gray">
<rect x="462" y="170" width="178" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="551" y="192" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">内网判定结果</text>
<text x="551" y="208" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">决定明文或强制加密</text>
</g>
<g class="s-ln"><line x1="640" y1="111" x2="658" y2="111" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-ln"><line x1="658" y1="111" x2="658" y2="200" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-ln"><line x1="658" y1="200" x2="644" y2="200" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-teal">
<rect x="40" y="170" width="178" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="129" y="192" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">auto 且命中内网</text>
<text x="129" y="208" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">明文直通，省 CPU</text>
</g>
<g class="s-coral">
<rect x="251" y="170" width="190" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="346" y="192" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">auto 未命中内网</text>
<text x="346" y="208" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">返回 428 并要求加密</text>
</g>
<g class="s-t2"><text x="40" y="258" font-size="13" fill="#5F5E5A">always：一律要求加密，无明文回退。</text></g>
<g class="s-t2"><text x="40" y="280" font-size="13" fill="#5F5E5A">never：从不下发加密要求，仅作排障兜底。</text></g>
</svg>
