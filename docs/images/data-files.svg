<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 434" width="100%" role="img">
<style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Hiragino Sans GB',sans-serif}
@media (prefers-color-scheme: dark){
g.s-blue>rect,g.s-blue>circle,g.s-blue>polygon{fill:#042C53;stroke:#85B7EB}
g.s-blue>text{fill:#B5D4F4}
g.s-teal>rect,g.s-teal>circle,g.s-teal>polygon{fill:#04342C;stroke:#5DCAA5}
g.s-teal>text{fill:#9FE1CB}
g.s-amber>rect,g.s-amber>circle,g.s-amber>polygon{fill:#412402;stroke:#EF9F27}
g.s-amber>text{fill:#FAC775}
g.s-purple>rect,g.s-purple>circle,g.s-purple>polygon{fill:#26215C;stroke:#AFA9EC}
g.s-purple>text{fill:#CECBF6}
g.s-coral>rect,g.s-coral>circle,g.s-coral>polygon{fill:#4A1B0C;stroke:#F0997B}
g.s-coral>text{fill:#F5C4B3}
g.s-gray>rect,g.s-gray>circle,g.s-gray>polygon{fill:#2C2C2A;stroke:#B4B2A9}
g.s-gray>text{fill:#D3D1C7}
g.s-red>rect,g.s-red>circle,g.s-red>polygon{fill:#501313;stroke:#F09595}
g.s-red>text{fill:#F7C1C1}
g.s-green>rect,g.s-green>circle,g.s-green>polygon{fill:#173404;stroke:#97C459}
g.s-green>text{fill:#C0DD97}
g.s-pink>rect,g.s-pink>circle,g.s-pink>polygon{fill:#4B1528;stroke:#ED93B1}
g.s-pink>text{fill:#F4C0D1}
g.s-neutral>rect{fill:#2C2C2A;stroke:#B4B2A9}
g.s-neutral>text{fill:#D3D1C7}
g.s-t1>text{fill:#F1EFE8}
g.s-t2>text{fill:#B4B2A9}
g.s-t3>text{fill:#888780}
g.s-ln>line,g.s-ln>path{stroke:#B4B2A9}
g.s-div>line{stroke:#444441}
}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g class="s-t1"><text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">数据目录：四个文件构成完整状态</text></g>
<g class="s-t3"><text x="40" y="52" font-size="12" fill="#888780">全部位于数据目录内，升级安装不会覆盖；备份该目录即可完整迁移。</text></g>
<g class="s-blue">
<rect x="40" y="74" width="178" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="129" y="96" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">accounts.json</text>
<text x="129" y="116" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">账号列表与登录态，与上游格式兼容</text>
</g>
<g class="s-t2"><text x="240" y="102" font-size="13" fill="#5F5E5A">可复用上游文件</text></g>
<line class="s-div" x1="240" y1="118" x2="640" y2="118" stroke="#E6E4DC" stroke-width="0.5"/>
<g class="s-teal">
<rect x="40" y="154" width="178" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="129" y="176" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">config.json</text>
<text x="129" y="196" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">全局配置、口令哈希、加密策略</text>
</g>
<g class="s-t2"><text x="240" y="182" font-size="13" fill="#5F5E5A">含凭据密钥</text></g>
<line class="s-div" x1="240" y1="198" x2="640" y2="198" stroke="#E6E4DC" stroke-width="0.5"/>
<g class="s-amber">
<rect x="40" y="234" width="178" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="129" y="256" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">state.json</text>
<text x="129" y="276" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">每日签到状态，按账号与日期去重</text>
</g>
<g class="s-t2"><text x="240" y="262" font-size="13" fill="#5F5E5A">决定是否补签</text></g>
<line class="s-div" x1="240" y1="278" x2="640" y2="278" stroke="#E6E4DC" stroke-width="0.5"/>
<g class="s-coral">
<rect x="40" y="314" width="178" height="66" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="129" y="336" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">keyring.json</text>
<text x="129" y="356" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">服务端长期身份密钥，权限 0600</text>
</g>
<g class="s-t2"><text x="240" y="342" font-size="13" fill="#5F5E5A">不参与会话派生</text></g>
<line class="s-div" x1="240" y1="358" x2="640" y2="358" stroke="#E6E4DC" stroke-width="0.5"/>
<g class="s-t3"><text x="40" y="408" font-size="12" fill="#888780">keyring.json 丢失不影响可用性，但客户端会提示身份变化，需重新信任。</text></g>
</svg>
