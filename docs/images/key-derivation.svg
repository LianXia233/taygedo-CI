<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 454" width="100%" role="img">
<style>
text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Hiragino Sans GB',sans-serif}
@media (prefers-color-scheme: dark){
g.s-blue>rect,g.s-blue>circle,g.s-blue>polygon{fill:#042C53;stroke:#85B7EB}
g.s-blue>text{fill:#B5D4F4}
g.s-teal>rect,g.s-teal>circle,g.s-teal>polygon{fill:#04342C;stroke:#5DCAA5}
g.s-teal>text{fill:#9FE1CB}
g.s-amber>rect,g.s-amber>circle,g.s-amber>polygon{fill:#412402;stroke:#EF9F27}
g.s-amber>text{fill:#FAC775}
g.s-purple>rect,g.s-purple>circle,g.s-purple>polygon{fill:#26215C;stroke:#AFA9EC}
g.s-purple>text{fill:#CECBF6}
g.s-coral>rect,g.s-coral>circle,g.s-coral>polygon{fill:#4A1B0C;stroke:#F0997B}
g.s-coral>text{fill:#F5C4B3}
g.s-gray>rect,g.s-gray>circle,g.s-gray>polygon{fill:#2C2C2A;stroke:#B4B2A9}
g.s-gray>text{fill:#D3D1C7}
g.s-red>rect,g.s-red>circle,g.s-red>polygon{fill:#501313;stroke:#F09595}
g.s-red>text{fill:#F7C1C1}
g.s-green>rect,g.s-green>circle,g.s-green>polygon{fill:#173404;stroke:#97C459}
g.s-green>text{fill:#C0DD97}
g.s-pink>rect,g.s-pink>circle,g.s-pink>polygon{fill:#4B1528;stroke:#ED93B1}
g.s-pink>text{fill:#F4C0D1}
g.s-neutral>rect{fill:#2C2C2A;stroke:#B4B2A9}
g.s-neutral>text{fill:#D3D1C7}
g.s-t1>text{fill:#F1EFE8}
g.s-t2>text{fill:#B4B2A9}
g.s-t3>text{fill:#888780}
g.s-ln>line,g.s-ln>path{stroke:#B4B2A9}
g.s-div>line{stroke:#444441}
}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g class="s-t1"><text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A">密钥派生链</text></g>
<g class="s-t3"><text x="40" y="52" font-size="12" fill="#888780">握手每会话一次；四个方向材料由同一共享秘密按用途分离，互不通用。</text></g>
<g class="s-blue">
<rect x="40" y="74" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="93" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">客户端临时私钥</text>
<text x="140" y="109" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">每次握手重新生成</text>
</g>
<g class="s-teal">
<rect x="440" y="74" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="93" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">服务端临时私钥</text>
<text x="540" y="109" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">每次握手重新生成</text>
</g>
<g class="s-ln"><line x1="242" y1="102" x2="300" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-ln"><line x1="438" y1="102" x2="380" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-purple">
<rect x="300" y="140" width="140" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="370" y="163" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">X25519</text>
</g>
<g class="s-ln"><line x1="370" y1="162" x2="370" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-amber">
<rect x="240" y="192" width="200" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="215" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">HKDF-SHA256</text>
</g>
<g class="s-t2"><text x="452" y="216" font-size="12" fill="#5F5E5A">salt = 双方公钥 + 双方 nonce</text></g>
<g class="s-ln"><line x1="340" y1="240" x2="340" y2="266" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-gray">
<rect x="240" y="268" width="200" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="288" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">会话材料</text>
</g>
<g class="s-ln"><line x1="115" y1="310" x2="115" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-blue">
<rect x="40" y="338" width="150" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="360" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">c2s</text>
<text x="115" y="376" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">客户端加密密钥</text>
</g>
<g class="s-ln"><line x1="265" y1="310" x2="265" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-teal">
<rect x="190" y="338" width="150" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="265" y="360" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">s2c</text>
<text x="265" y="376" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">服务端加密密钥</text>
</g>
<g class="s-ln"><line x1="415" y1="310" x2="415" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-amber">
<rect x="340" y="338" width="150" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="415" y="360" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">nonce c2s</text>
<text x="415" y="376" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">4B 前缀 + 8B 计数</text>
</g>
<g class="s-ln"><line x1="565" y1="310" x2="565" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/></g>
<g class="s-amber">
<rect x="490" y="338" width="150" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="565" y="360" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">nonce s2c</text>
<text x="565" y="376" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">4B 前缀 + 8B 计数</text>
</g>
<g class="s-t3"><text x="40" y="428" font-size="12" fill="#888780">会话密钥仅存活于内存，过期或超限即 zeroize 擦除；长期身份密钥不参与派生。</text></g>
</svg>
