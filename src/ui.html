<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>塔吉多自动签到</title>
<style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --border: #e7eaf0;
  --text: #1a2233;
  --text-sub: #6b7280;
  --primary: #4f46e5;
  --primary-2: #7c3aed;
  --primary-soft: #eef2ff;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --amber: #d97706;
  --amber-soft: #fef3c7;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  --shadow-lg: 0 10px 30px rgba(16,24,40,.10);
  --bg-mask: rgba(245, 247, 251, 0.88);
  --panel-translucent: rgba(255, 255, 255, 0.82);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #2a3038;
  --text: #e6edf3;
  --text-sub: #8b949e;
  --primary: #818cf8;
  --primary-2: #a78bfa;
  --primary-soft: #1e2440;
  --green: #3fb950;
  --green-soft: #12261c;
  --red: #f85149;
  --red-soft: #2d1517;
  --amber: #d29922;
  --amber-soft: #2a2410;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --bg-mask: rgba(13, 17, 23, 0.9);
  --panel-translucent: rgba(22, 27, 34, 0.84);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .2s, color .2s;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }

/* header */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; background: var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 16px; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .logo {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.brand h1 {
  font-size: 17px; font-weight: 800; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand p { font-size: 12px; color: var(--text-sub); margin-top: 2px; display: none; }
.hdr-actions { display: flex; align-items: center; gap: 8px; flex: none; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: all .15s; white-space: nowrap; min-height: 38px;
}
.btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: none; box-shadow: 0 4px 14px rgba(79,70,229,.28); }
.btn.primary:hover { opacity: .92; color: #fff; box-shadow: 0 6px 18px rgba(79,70,229,.36); }
.btn.danger:hover { border-color: var(--red); color: var(--red); }
.btn.icon { padding: 9px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn .btn-txt { }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); transition: transform .18s ease, box-shadow .18s ease; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat .num { font-size: 24px; font-weight: 800; }
.stat .label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.stat.total .num { background: linear-gradient(120deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.stat.done .num { color: var(--green); }
.stat.pending .num { color: var(--amber); }

/* layout */
.main { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) {
  .main { grid-template-columns: 1.2fr 1fr; align-items: start; }
  .brand p { display: block; }
}

/* accounts */
.accounts { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .accounts { grid-template-columns: repeat(2, 1fr); } }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  opacity: 0; transition: opacity .2s;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
.card:hover::before { opacity: 1; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.avatar {
  width: 46px; height: 46px; border-radius: 14px; flex: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; box-shadow: 0 4px 12px rgba(79,70,229,.25);
}
.card-info { flex: 1; min-width: 0; }
.card-info .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-info .name { font-weight: 700; font-size: 15.5px; letter-spacing: .3px; }
.card-info .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.meta-tag {
  font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--bg);
  color: var(--text-sub); display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis;
}
.meta-tag svg { width: 12px; height: 12px; flex: none; opacity: .65; }
.meta-tag.uid { font-family: var(--mono); font-size: 11px; }
.meta-tag.role { background: var(--primary-soft); color: var(--primary); }
.badge { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px; flex: none; letter-spacing: .3px; }
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.wait { background: var(--amber-soft); color: var(--amber); }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-row .lab { font-size: 12.5px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
.card-row .lab svg { width: 14px; height: 14px; }
.time-input {
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
  background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; min-height: 34px;
}
.card-actions { display: flex; gap: 8px; }
.card-actions .btn { flex: 1; padding: 9px 10px; font-size: 13px; }
.empty {
  grid-column: 1 / -1; text-align: center; padding: 44px 20px;
  color: var(--text-sub); border: 1.5px dashed var(--border); border-radius: var(--radius);
}
.empty .big { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* panel + logs */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.panel-head h2 svg { width: 16px; height: 16px; color: var(--primary); }

/* log filter tabs */
.log-tabs { display: flex; gap: 4px; padding: 10px 14px 0; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.log-tabs::-webkit-scrollbar { display: none; }
.log-tab {
  padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; border: 1px solid transparent;
  background: none; color: var(--text-sub); transition: all .15s;
}
.log-tab:hover { background: var(--bg); color: var(--text); }
.log-tab.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

.logs { height: 380px; overflow-y: auto; padding: 12px 14px; background: #0b1020; font-family: var(--mono); font-size: 12px; line-height: 1.7; -webkit-overflow-scrolling: touch; }
[data-theme="dark"] .logs { background: #0a0d16; }
.log-line { color: #c9d1d9; word-break: break-all; }
.log-line .ts { color: #6b7280; margin-right: 6px; }
.log-line .lv { font-weight: 700; margin-right: 6px; }
.log-line.info .lv { color: #58a6ff; }
.log-line.error .lv { color: #f85149; }
.log-line.warn .lv { color: #d29922; }
.logs .empty-log { color: #6b7280; }

/* login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card {
  width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 18px; box-shadow: var(--shadow-lg); padding: 34px 30px; text-align: center;
}
.login-card .logo {
  width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.login-card h1 { font-size: 20px; font-weight: 800; background: linear-gradient(120deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.login-card .sub { font-size: 13px; color: var(--text-sub); margin: 6px 0 22px; }
.login-card .input { text-align: center; font-size: 15px; }

/* 入场动画 */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
header { animation: fadeUp .4s ease both; }
.stats { animation: fadeUp .45s ease both; }
.main { animation: fadeUp .5s ease both; }
.login-card { animation: fadeUp .4s ease both; }

/* modal */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-mask.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--panel); border-radius: 16px; width: 100%; max-width: 440px;
  max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-lg); transform: translateY(8px); transition: transform .2s;
}
.modal-mask.show .modal { transform: translateY(0); }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--panel); }
.modal-head h3 { font-size: 16px; font-weight: 700; }
.modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 13px; }
.modal-close { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 22px; line-height: 1; padding: 4px; }
.modal-close:hover { color: var(--text); }

/* tabs */
.tabs { display: flex; gap: 6px; background: var(--bg); border-radius: 10px; padding: 4px; }
.tab { flex: 1; text-align: center; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-sub); border: none; background: none; }
.tab.active { background: var(--panel); color: var(--primary); box-shadow: var(--shadow); }

/* form */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-sub); }
.input {
  border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px;
  font-size: 14px; background: var(--bg); color: var(--text); outline: none;
  transition: border-color .15s; width: 100%; min-height: 44px;
}
.input:focus { border-color: var(--primary); }
.captcha-row { display: flex; gap: 8px; }
.captcha-row .input { flex: 1; }
.captcha-row .btn { flex: none; }
.switch-row { display: flex; align-items: center; justify-content: space-between; }
.switch-row .txt { font-size: 14px; }
.switch { position: relative; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; cursor: pointer; transition: .2s; }
.switch .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider:before { transform: translateX(20px); }

.divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text-sub); }

/* toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 11px 20px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600; z-index: 100; opacity: 0; transition: all .25s;
  box-shadow: var(--shadow-lg); max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--red); color: #fff; }
.toast.ok { background: var(--green); color: #fff; }

.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* mobile */
@media (max-width: 520px) {
  .wrap { padding: 12px 10px 40px; }
  header { padding: 12px 14px; }
  .brand h1 { font-size: 16px; }
  .btn .btn-txt.hide-m { display: none; }
  .stats { gap: 8px; }
  .stat { padding: 12px 12px; }
  .stat .num { font-size: 21px; }
  .logs { height: 280px; }
  .card-actions .btn { font-size: 12.5px; }
  .meta-tags { gap: 4px; }
  .meta-tag { font-size: 10.5px; padding: 2px 6px; max-width: 120px; }
}

/* ---- 背景壁纸 + 毛玻璃 ---- */
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--bg-mask), var(--bg-mask)),
    url('https://files.seeusercontent.com/2026/06/29/uu4H/bg1.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
header, .card, .stat, .panel, .modal, .login-card {
  background: var(--panel-translucent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.panel-head, .modal-head {
  background: transparent;
}
</style>
</head>

<div class="wrap">

</div>
</div>

<!-- 添加账号 modal -->
<div class="modal-mask" id="addModal">
  <div class="modal">
    <div class="modal-head">
      <h3>添加账号</h3>
      <button class="modal-close" data-close="addModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="tabs">
        <button class="tab active" data-mode="password">密码登录</button>
        <button class="tab" data-mode="captcha">验证码登录</button>
      </div>
      <div class="field">
        <label>手机号</label>
        <input class="input" id="loginPhone" placeholder="请输入手机号" inputmode="numeric">
      </div>
      <div class="field" id="passwordField">
        <label>密码</label>
        <input class="input" id="loginPassword" type="password" placeholder="请输入密码">
      </div>
      <div class="field" id="captchaField" style="display:none">
        <label>验证码</label>
        <div class="captcha-row">
          <input class="input" id="loginCaptcha" placeholder="短信验证码" inputmode="numeric">
          <button class="btn" id="sendCodeBtn">发送验证码</button>
        </div>
      </div>
      <div class="field">
        <label>备注名（可选）</label>
        <input class="input" id="loginName" placeholder="如：主账号">
      </div>
      <button class="btn primary" id="loginSubmit">登录</button>
    </div>
  </div>
</div>

<!-- 设置 modal -->
<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <div class="modal-head">
      <h3>全局设置</h3>
      <button class="modal-close" data-close="settingsModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>默认签到时间（每天）</label>
        <input class="input time-input" type="time" id="cfgSchedule">
      </div>
      <div class="switch-row">
        <span class="txt">金币任务</span>
        <label class="switch"><input type="checkbox" id="cfgCoin"><span class="slider"></span></label>
      </div>
      <div class="switch-row">
        <span class="txt">云异环时长</span>
        <label class="switch"><input type="checkbox" id="cfgCloud"><span class="slider"></span></label>
      </div>
      <div class="field">
        <label>分享平台</label>
        <input class="input" id="cfgShare" placeholder="qq / wechat / weibo">
      </div>
      <button class="btn primary" id="cfgSave">保存</button>

      <hr class="divider">
      <div class="section-title">修改登录账号密码</div>
      <div class="field">
        <label>账号</label>
        <input class="input" id="oldUser" value="admin" autocomplete="username">
      </div>
      <div class="field">
        <label>原密码</label>
        <input class="input" type="password" id="oldPwd" autocomplete="current-password">
      </div>
      <div class="field">
        <label>新密码（至少 6 位）</label>
        <input class="input" type="password" id="newPwd" autocomplete="new-password">
      </div>
      <button class="btn" id="pwdSave">修改账号密码</button>

      <hr class="divider">
      <button class="btn danger" id="logoutBtn">退出登录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let currentMode = 'password';
let token = localStorage.getItem('taygedo_token') || '';
let sendCodeTimer = null;
let allAccounts = [];       // 全局账号列表，用于日志按账号筛选
let allLogsRaw = [];        // 原始日志（未筛选）
let currentLogFilter = 'all'; // 当前日志筛选：'all' 或 account.id

function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2600);
}

function showLogin() {
  $('mainScreen').style.display = 'none';
  $('loginScreen').style.display = '';
}
function showMain() {
  $('loginScreen').style.display = 'none';
  $('mainScreen').style.display = '';
}

async function api(path, method, body) {
  const opts = { method, headers: {} };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error('未登录或登录已过期'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

async function doLogin(e) {
  e && e.preventDefault();
  const user = $('loginUser').value.trim() || 'admin';
  const pwd = $('loginPwd').value;
  if (!pwd) { toast('请输入密码', 'err'); return; }
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pwd }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '登录失败');
    token = j.token;
    localStorage.setItem('taygedo_token', token);
    $('loginPwd').value = '';
    showMain();
    loadAccounts();
    loadLogs();
    toast('登录成功', 'ok');
  } catch (err) {
    toast(err.message, 'err');
  }
  btn.disabled = false; btn.textContent = '登 录';
}

async function loadAccounts() {
  try {
    const data = await api('/api/accounts', 'GET');
    const list = data.accounts || [];
    allAccounts = list; // 存全局，供日志筛选用
    $('statTotal').textContent = list.length;
    $('statDone').textContent = list.filter(a => a.signed_today).length;
    $('statPending').textContent = list.filter(a => !a.signed_today).length;
    renderAccounts(list);
    buildLogTabs(list); // 重建日志筛选标签
    if (allLogsRaw.length) renderLogs(); // 刷新日志显示（应用当前筛选）
  } catch (e) { console.error(e); }
}

function renderAccounts(list) {
  const wrap = $('accounts');
  if (!list.length) {
    wrap.innerHTML = `<div class="empty"><div class="big">还没有账号</div>点击右上角「添加账号」开始使用</div>`;
    return;
  }
  wrap.innerHTML = list.map(a => `
    <div class="card" data-id="${a.id}">
      <div class="card-top">
        <div class="avatar">${esc(a.name).charAt(0).toUpperCase()}</div>
        <div class="card-info">
          <div class="name-row">
            <div class="name">${esc(a.name)}</div>
            ${a.signed_today ? '<span class="badge ok">今日已签</span>' : '<span class="badge wait">待签到</span>'}
          </div>
          <div class="meta-tags">
            ${a.phone ? `<span class="meta-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.18 4.18 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${esc(a.phone)}</span>` : ''}
            <span class="meta-tag uid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 12h.01"/></svg>UID ${esc(a.uid || '-')}</span>
            ${a.role_name ? `<span class="meta-tag role"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(a.role_name)}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="card-row">
        <span class="lab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          每日签到时间
        </span>
        <input class="input time-input" type="time" value="${esc(a.schedule)}" data-schedule="${a.id}">
      </div>
      <div class="card-actions">
        <button class="btn primary" data-signin="${a.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
          立即签到
        </button>
        <button class="btn danger" data-del="${a.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          删除
        </button>
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('[data-schedule]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const id = inp.dataset.schedule;
      try {
        await api(`/api/accounts/${id}/schedule`, 'POST', { time: inp.value || null });
        toast('签到时间已更新', 'ok');
        loadAccounts();
      } catch (e) { toast(e.message, 'err'); }
    });
  });
  wrap.querySelectorAll('[data-signin]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.signin;
      btn.disabled = true;
      btn.innerHTML = '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg> 签到中...';
      try {
        await api(`/api/accounts/${id}/signin`, 'POST', { force: true });
        toast('签到完成', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg> 立即签到';
      loadAccounts();
      loadLogs();
    });
  });
  wrap.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.del;
      if (!confirm('确认删除该账号？删除后需重新登录。')) return;
      try {
        await api(`/api/accounts/${id}`, 'DELETE');
        toast('已删除', 'ok');
        loadAccounts();
      } catch (e) { toast(e.message, 'err'); }
    });
  });
}

async function loadLogs() {
  try {
    const data = await api('/api/logs?limit=200', 'GET');
    allLogsRaw = data.logs || [];
    renderLogs();
  } catch (e) { console.error(e); }
}

/** 根据当前 currentLogFilter 筛选并渲染日志 */
function renderLogs() {
  const box = $('logs');
  let logs = allLogsRaw;

  // 按账号筛选：日志消息中包含「账号 xxx（id）」的归入该账号
  if (currentLogFilter !== 'all') {
    const acc = allAccounts.find(a => a.id === currentLogFilter);
    if (acc) {
      // 匹配包含账号名或 ID 的日志行
      const keywords = [acc.name, acc.id, acc.uid].filter(Boolean);
      logs = logs.filter(l => keywords.some(k => (l.message || '').includes(k)));
    }
  }

  if (!logs.length) { box.innerHTML = '<div class="empty-log">' + (currentLogFilter === 'all' ? '暂无日志' : '该账号暂无日志') + '</div>'; return; }
  box.innerHTML = logs.map(l => {
    const lv = (l.level || 'info').toUpperCase().padEnd(5, ' ');
    return `<div class="log-line ${esc(l.level || 'info')}"><span class="ts">${esc(l.ts)}</span><span class="lv">${esc(lv)}</span>${esc(l.message)}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

/** 构建日志筛选标签栏 */
function buildLogTabs(accounts) {
  const wrap = $('logTabs');
  let html = '<button class="log-tab' + (currentLogFilter === 'all' ? ' active' : '') + '" data-filter="all">全部</button>';
  accounts.forEach(a => {
    html += '<button class="log-tab' + (currentLogFilter === a.id ? ' active' : '') + '" data-filter="' + esc(a.id) + '">' + esc(a.name) + '</button>';
  });
  wrap.innerHTML = html;
  // 绑定点击
  wrap.querySelectorAll('.log-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      wrap.querySelectorAll('.log-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentLogFilter = tab.dataset.filter;
      renderLogs();
    });
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* modal helpers */
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
document.querySelectorAll('.modal-mask').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

/* tabs */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentMode = t.dataset.mode;
  $('passwordField').style.display = currentMode === 'password' ? '' : 'none';
  $('captchaField').style.display = currentMode === 'captcha' ? '' : 'none';
}));

/* send code */
$('sendCodeBtn').addEventListener('click', async () => {
  const phone = $('loginPhone').value.trim();
  if (!phone) { toast('请输入手机号', 'err'); return; }
  const btn = $('sendCodeBtn');
  btn.disabled = true;
  try {
    await api('/api/send-code', 'POST', { phone });
    toast('验证码已发送', 'ok');
    let n = 60;
    btn.textContent = n + 's';
    sendCodeTimer = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(sendCodeTimer); btn.textContent = '发送验证码'; btn.disabled = false; }
      else btn.textContent = n + 's';
    }, 1000);
  } catch (e) {
    toast(e.message, 'err');
    btn.disabled = false;
  }
});

/* login submit */
$('loginSubmit').addEventListener('click', async () => {
  const phone = $('loginPhone').value.trim();
  const name = $('loginName').value.trim();
  if (!phone) { toast('请输入手机号', 'err'); return; }
  const btn = $('loginSubmit');
  btn.disabled = true; btn.textContent = '登录中...';
  const body = { phone, mode: currentMode, name: name || null };
  if (currentMode === 'password') {
    body.password = $('loginPassword').value;
    if (!body.password) { toast('请输入密码', 'err'); btn.disabled = false; btn.textContent = '登录'; return; }
  } else {
    body.captcha = $('loginCaptcha').value;
    if (!body.captcha) { toast('请输入验证码', 'err'); btn.disabled = false; btn.textContent = '登录'; return; }
  }
  try {
    await api('/api/accounts', 'POST', body);
    toast('登录成功', 'ok');
    closeModal('addModal');
    $('loginPassword').value = ''; $('loginCaptcha').value = ''; $('loginPhone').value = ''; $('loginName').value = '';
    loadAccounts();
  } catch (e) {
    toast(e.message, 'err');
  }
  btn.disabled = false; btn.textContent = '登录';
});

/* add modal open */
$('addBtn').addEventListener('click', () => {
  currentMode = 'password';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.mode === 'password'));
  $('passwordField').style.display = '';
  $('captchaField').style.display = 'none';
  openModal('addModal');
});

/* settings */
let loadedCfg = {};
async function openSettings() {
  try {
    loadedCfg = await api('/api/config', 'GET');
    $('cfgSchedule').value = loadedCfg.default_schedule;
    $('cfgCoin').checked = !!loadedCfg.coin_tasks;
    $('cfgCloud').checked = !!loadedCfg.cloud_duration;
    $('cfgShare').value = loadedCfg.share_platform || 'qq';
    $('oldUser').value = 'admin'; $('oldPwd').value = ''; $('newPwd').value = '';
    openModal('settingsModal');
  } catch (e) { toast(e.message, 'err'); }
}
$('settingsBtn').addEventListener('click', openSettings);
$('cfgSave').addEventListener('click', async () => {
  try {
    await api('/api/config', 'POST', {
      default_schedule: $('cfgSchedule').value,
      coin_tasks: $('cfgCoin').checked,
      cloud_duration: $('cfgCloud').checked,
      share_platform: $('cfgShare').value.trim() || 'qq',
    });
    toast('设置已保存', 'ok');
    closeModal('settingsModal');
    loadAccounts();
  } catch (e) { toast(e.message, 'err'); }
});

/* change password */
$('pwdSave').addEventListener('click', async () => {
  const oldUser = $('oldUser').value.trim() || 'admin';
  const oldPwd = $('oldPwd').value;
  const newPwd = $('newPwd').value;
  if (!oldPwd || !newPwd) { toast('请输入原密码和新密码', 'err'); return; }
  try {
    await api('/api/password', 'POST', { username: oldUser, old_password: oldPwd, new_password: newPwd });
    toast('账号密码已修改', 'ok');
    $('oldPwd').value = ''; $('newPwd').value = '';
  } catch (e) { toast(e.message, 'err'); }
});

/* logout */
$('logoutBtn').addEventListener('click', () => {
  token = '';
  localStorage.removeItem('taygedo_token');
  showLogin();
  toast('已退出登录');
});

/* theme */
function applyTheme(t) {
  document.body.dataset.theme = t;
  localStorage.setItem('taygedo-theme', t);
  $('themeBtn').innerHTML = t === 'dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}
$('themeBtn').addEventListener('click', () => {
  applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
});
applyTheme(localStorage.getItem('taygedo-theme') || 'light');

$('refreshLogsBtn').addEventListener('click', loadLogs);
$('loginForm').addEventListener('submit', doLogin);

/* init */
(async function init() {
  // 免鉴权模式（TAYGEDO_NO_AUTH=1）：跳过登录，直接进入主界面
  try {
    const meta = await (await fetch('/api/meta')).json();
    if (meta.no_auth) {
      showMain();
      loadAccounts();
      loadLogs();
      return;
    }
  } catch (e) { /* 探测失败则按原逻辑处理 */ }
  if (!token) { showLogin(); return; }
  try {
    await api('/api/accounts', 'GET');
    showMain();
    loadAccounts();
    loadLogs();
  } catch (e) {
    showLogin();
  }
})();

let pollTimer = null;
function startPoll() {
  if (pollTimer) return;
  pollTimer = setInterval(() => {
    if (token) { loadLogs(); }
  }, 3000);
}
setInterval(() => { if (token && $('mainScreen').style.display !== 'none') loadAccounts(); }, 10000);
startPoll();
</script>
</body>
</html>
